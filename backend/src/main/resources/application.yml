spring:
  application:
    name: shuim-backend
  config:
    import: optional:file:.env[.properties],optional:file:backend/.env[.properties]
  flyway:
    enabled: true
    table: flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    # TS 서버가 undefined 로 비우던 선택 필드를 JSON 에서 빼기 위해 null 은 직렬화하지 않는다
    default-property-inclusion: non_null
server:
  # Elastic Beanstalk Java SE nginx forwards to 5000 unless PORT is set.
  # Local development overrides this with SERVER_PORT in backend/.env.
  port: ${SERVER_PORT:${PORT:5000}}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: ${SPRING_JDBC_LOG_LEVEL:WARN}
app:
  origin: ${APP_ORIGIN:http://localhost:3000}
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    # 운영 기본값은 Secure 쿠키. Chrome 은 http://localhost 에서도 Secure 쿠키를 받아 주므로 로컬 개발도 그대로 된다
    secure-cookie: ${AUTH_SECURE_COOKIE:true}
    session-days: ${AUTH_SESSION_DAYS:90}
  db:
    # jdbc:postgresql://host:6543/db?user=..&password=..  또는  postgresql://user:pass@host:6543/db
    url: ${DB_URL:}
    pool-max: ${DB_POOL_MAX:3}
    keep-session-mode: ${DB_KEEP_SESSION_MODE:false}
  community:
    # 개발용 샘플 유저 자동 답글. 기본은 꺼짐, 로컬에서만 .env 로 COMMUNITY_SIMULATE=true
    simulate: ${COMMUNITY_SIMULATE:false}
  security:
    # 설정하면 /api/** 는 X-Sorow-Origin-Secret 헤더가 같아야 한다 (Vercel 프록시만 통과). 비우면 검사하지 않는다
    origin-secret: ${ORIGIN_SHARED_SECRET:}
  http:
    # 요청 본문 상한 (바이트). 관리자 화면·사이트 설정·기록 가져오기는 large 한도
    max-body-bytes: ${MAX_BODY_BYTES:2097152}
    max-large-body-bytes: ${MAX_LARGE_BODY_BYTES:8388608}
  rate-limit:
    # 메모리 토큰 버킷 (단일 인스턴스 전제). 형식은 개수/기간 (예: 30/10m, 20/1h), off 면 그 키는 세지 않는다
    enabled: ${RATE_LIMIT_ENABLED:true}
    # 모든 한도에 곱하는 배율 (예: 2 면 두 배로 느슨하게)
    scale: ${RATE_LIMIT_SCALE:1}
    max-keys: ${RATE_LIMIT_MAX_KEYS:100000}
    general-ip: ${RATE_LIMIT_GENERAL_IP:6000/1m}
    general-session: ${RATE_LIMIT_GENERAL_SESSION:1200/1m}
    auth-ip: ${RATE_LIMIT_AUTH_IP:30/5m}
    auth-session: ${RATE_LIMIT_AUTH_SESSION:10/1m}
    ai-ip: ${RATE_LIMIT_AI_IP:100/10m}
    ai-session: ${RATE_LIMIT_AI_SESSION:20/10m}
    mail-ip: ${RATE_LIMIT_MAIL_IP:30/10m}
    mail-session: ${RATE_LIMIT_MAIL_SESSION:10/10m}
    dm-ip: ${RATE_LIMIT_DM_IP:120/1m}
    dm-session: ${RATE_LIMIT_DM_SESSION:30/1m}
    report-ip: ${RATE_LIMIT_REPORT_IP:60/10m}
    report-session: ${RATE_LIMIT_REPORT_SESSION:20/10m}
    upload-ip: ${RATE_LIMIT_UPLOAD_IP:120/1m}
    upload-session: ${RATE_LIMIT_UPLOAD_SESSION:30/1m}
    payment-ip: ${RATE_LIMIT_PAYMENT_IP:60/1m}
    payment-session: ${RATE_LIMIT_PAYMENT_SESSION:20/1m}
    banner-click-ip: ${RATE_LIMIT_BANNER_CLICK_IP:30/1m}
    banner-click-session: ${RATE_LIMIT_BANNER_CLICK_SESSION:10/1m}
    # 쿠키·토큰 없는 쓰기 요청 (매번 익명 계정을 만들 수 있다)
    anon-write-ip: ${RATE_LIMIT_ANON_WRITE_IP:20/1h}
    anon-create-ip: ${RATE_LIMIT_ANON_CREATE_IP:30/1h}
    anon-create-global: ${RATE_LIMIT_ANON_CREATE_GLOBAL:3000/1h}
  circle:
    private-test-creation-enabled: ${PRIVATE_TEST_CIRCLES_ENABLED:false}
  fireworks:
    # 회원이 이용권으로 폭죽을 쏘는 기능. 꺼져 있으면 관리자만 쏘고, 회원에게는 폭죽·이용권 화면이 보이지 않는다
    members-enabled: ${FIREWORKS_MEMBERS_ENABLED:false}
  kakao:
    # Kakao Developers › 내 애플리케이션 › 앱 키 › REST API 키. 비우면 카카오 로그인이 꺼지고 버튼이 숨겨진다 (/api/auth/me 의 kakao: false)
    client-id: ${KAKAO_CLIENT_ID:}
    # 카카오 로그인 › 보안 › Client Secret 을 "사용함"으로 켠 경우에만
    client-secret: ${KAKAO_CLIENT_SECRET:}
    # Redirect URI 는 app.origin + /api/auth/kakao/callback 로 만든다 (프론트 프록시를 거쳐야 세션 쿠키가 프론트 출처에 남는다)
  ait:
    # 앱인토스 콘솔의 appName. 넣으면 https://<appName>.web.tossmini.com · .private-web.tossmini.com 을 CORS 로 허용한다
    app-name: ${AIT_APP_NAME:}
  toss:
    # 토스 로그인 mTLS 인증서·키 (PEM 파일 경로 또는 PEM 내용). 둘 다 있어야 토스 로그인이 켜진다
    mtls-cert: ${TOSS_MTLS_CERT:}
    mtls-key: ${TOSS_MTLS_KEY:}
    # 연결 끊기 콜백에 콘솔이 붙이는 Authorization 값 ("Basic xxx" 전체). 비우면 콜백을 받지 않는다
    unlink-basic-auth: ${TOSS_UNLINK_BASIC_AUTH:}
    api-base: ${TOSS_API_BASE:https://apps-in-toss-api.toss.im}
  payments:
    sales-enabled: ${PAYMENT_SALES_ENABLED:false}
    # 서버가 1,000원/24시간을 고정한다. 키/상품 설정이 없으면 구매가 꺼진다.
    reconcile-delay-ms: ${PAYMENT_RECONCILE_DELAY_MS:60000}
    toss:
      client-key: ${TOSS_PAYMENTS_CLIENT_KEY:}
      secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}
      api-base: ${TOSS_PAYMENTS_API_BASE:https://api.tosspayments.com}
    ait:
      rose-sku: ${AIT_IAP_ROSE_SKU:}
      aurora-sku: ${AIT_IAP_AURORA_SKU:}
      ocean-sku: ${AIT_IAP_OCEAN_SKU:}
      violet-sku: ${AIT_IAP_VIOLET_SKU:}
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${S3_BUCKET:}
    prefix: ${S3_PREFIX:feed}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    session-token: ${AWS_SESSION_TOKEN:}
    cdn-base-url: ${CDN_BASE_URL:}
  ai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-6.1-terra}
  mail:
    # 커뮤니티 소로우 소속 인증 메일. 비우면 메일을 보내지 않고, 개발 환경에서만 인증 코드를 화면에 보여 준다
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${MAIL_FROM:no-reply@sorow.co.kr}
