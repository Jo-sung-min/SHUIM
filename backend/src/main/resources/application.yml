spring:
  application:
    name: shuim-backend
  config:
    import: optional:file:.env[.properties],optional:file:backend/.env[.properties]
  flyway:
    enabled: true
    table: flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    # TS 서버가 undefined 로 비우던 선택 필드를 JSON 에서 빼기 위해 null 은 직렬화하지 않는다
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: ${SPRING_JDBC_LOG_LEVEL:WARN}
app:
  origin: ${APP_ORIGIN:http://localhost:3000}
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    secure-cookie: ${AUTH_SECURE_COOKIE:false}
    session-days: ${AUTH_SESSION_DAYS:90}
  db:
    # jdbc:postgresql://host:6543/db?user=..&password=..  또는  postgresql://user:pass@host:6543/db
    url: ${DB_URL:}
    pool-max: ${DB_POOL_MAX:3}
    keep-session-mode: ${DB_KEEP_SESSION_MODE:false}
  community:
    # 개발용 샘플 유저 자동 답글 (운영에서는 false)
    simulate: ${COMMUNITY_SIMULATE:true}
  kakao:
    # Kakao Developers › 내 애플리케이션 › 앱 키 › REST API 키. 비우면 카카오 로그인이 꺼지고 버튼이 숨겨진다 (/api/auth/me 의 kakao: false)
    client-id: ${KAKAO_CLIENT_ID:}
    # 카카오 로그인 › 보안 › Client Secret 을 "사용함"으로 켠 경우에만
    client-secret: ${KAKAO_CLIENT_SECRET:}
    # Redirect URI 는 app.origin + /api/auth/kakao/callback 로 만든다 (프론트 프록시를 거쳐야 세션 쿠키가 프론트 출처에 남는다)
  ait:
    # 앱인토스 콘솔의 appName. 넣으면 https://<appName>.web.tossmini.com · .private-web.tossmini.com 을 CORS 로 허용한다
    app-name: ${AIT_APP_NAME:}
  toss:
    # 토스 로그인 mTLS 인증서·키 (PEM 파일 경로 또는 PEM 내용). 둘 다 있어야 토스 로그인이 켜진다
    mtls-cert: ${TOSS_MTLS_CERT:}
    mtls-key: ${TOSS_MTLS_KEY:}
    # 연결 끊기 콜백에 콘솔이 붙이는 Authorization 값 ("Basic xxx" 전체). 비우면 콜백을 받지 않는다
    unlink-basic-auth: ${TOSS_UNLINK_BASIC_AUTH:}
    api-base: ${TOSS_API_BASE:https://apps-in-toss-api.toss.im}
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${S3_BUCKET:}
    prefix: ${S3_PREFIX:feed}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    cdn-base-url: ${CDN_BASE_URL:}
  ai:
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-haiku-5-5}
  mail:
    # 커뮤니티 소로우 소속 인증 메일. 비우면 메일을 보내지 않고, 개발 환경에서만 인증 코드를 화면에 보여 준다
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${MAIL_FROM:no-reply@sorow.co.kr}
